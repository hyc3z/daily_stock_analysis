name: deploy

# Build on a GitHub runner, push to Huawei SWR, then trigger the restricted
# deploy entry on the server over SSH. SWR is used because the server reaches it
# fast (in-China), while GHCR/Docker Hub are effectively unreachable from it.
#
# Repository secrets:
#   SWR_USERNAME / SWR_PASSWORD   from SWR -> Login Command -> long-term command
#                                 generated with the CI IAM user's AK/SK
#                                 (username keeps its region prefix, e.g. cn-north-4@...)
#   DSA_DEPLOY_SSH_KEY            private key locked to
#                                 command="/usr/local/bin/agent-ops-gh-deploy-dsa",restrict
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dsa-deploy
  cancel-in-progress: false

env:
  REGISTRY: swr.cn-north-4.myhuaweicloud.com
  IMAGE: swr.cn-north-4.myhuaweicloud.com/agent-playground/dsa

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      # Docker media types (not OCI) plus no provenance/SBOM: this is the export
      # form the existing SWR repositories were verified with.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          outputs: type=image,push=true,oci-mediatypes=false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            DSA_WEB_VERSION=${{ github.sha }}
            DSA_WEB_REVISION=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH deploy
        env:
          HOST: 124.223.8.213
          PORT: 22
          USER: ubuntu
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DSA_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # The server pulls a large image inside this session; keepalives plus a
          # server-side detached unit keep the deploy alive across idle windows.
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=40 \
            -p "$PORT" "$USER@$HOST" "deploy $SHA"

      - name: Verify site
        run: |
          curl -fsS -o /dev/null -w 'site https=%{http_code}\n' https://stock.qianxue.online/ \
            || echo "verify skipped: site not wired up yet"
