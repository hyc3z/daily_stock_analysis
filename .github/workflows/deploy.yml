name: deploy

# Build on a GitHub runner, push to GHCR with the automatic GITHUB_TOKEN (no
# long-lived registry credentials), then trigger the restricted deploy entry on
# the server over SSH.
#
# The only repository secret this needs is DSA_DEPLOY_SSH_KEY, whose public half
# is locked to command="/usr/local/bin/agent-ops-gh-deploy-dsa",restrict.
#
# After the first successful push the package must be made Public once
# (repo -> Packages -> daily_stock_analysis -> settings -> Change visibility),
# so the server can pull it anonymously.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dsa-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/hyc3z/daily_stock_analysis

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            DSA_WEB_VERSION=${{ github.sha }}
            DSA_WEB_REVISION=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH deploy
        env:
          # Not a secret: the same public IP serves the domain.
          HOST: 124.223.8.213
          PORT: 22
          USER: ubuntu
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DSA_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Keepalives ride out the idle window while the server pulls a large image.
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=40 \
            -p "$PORT" "$USER@$HOST" "deploy $SHA"

      - name: Verify site
        # Tolerated until the Caddy site block is in place.
        run: |
          curl -fsS -o /dev/null -w 'site https=%{http_code}\n' https://stock.qianxue.online/ \
            || echo "verify skipped: site not wired up yet"
