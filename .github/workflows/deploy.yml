name: deploy

# Build on a GitHub runner, push to Huawei SWR, then:
#   1. push runtime secrets to the server over SSH (stdin only, never argv),
#   2. trigger the restricted deploy entry, which pulls the image and restarts.
#
# Repository secrets:
#   SWR_USERNAME / SWR_PASSWORD   SWR long-term login command values
#   DSA_DEPLOY_SSH_KEY            private key locked to
#                                 command="/usr/local/bin/agent-ops-gh-deploy-dsa",restrict
#   DEEPSEEK_API_KEY              runtime only; written into the server config
#   TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID   optional notifications
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dsa-deploy
  cancel-in-progress: false

env:
  REGISTRY: swr.cn-north-4.myhuaweicloud.com
  IMAGE: swr.cn-north-4.myhuaweicloud.com/agent-playground/dsa
  # 0 = 不装 wkhtmltopdf + CJK 字体，省约 200MB；报告转图片能力随之关闭。
  INSTALL_PDF_RENDERER: '0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      # Docker media types (not OCI) plus no provenance/SBOM: the export form the
      # existing SWR repositories were verified with.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          outputs: type=image,push=true,oci-mediatypes=false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            INSTALL_PDF_RENDERER=${{ env.INSTALL_PDF_RENDERER }}
            DSA_WEB_VERSION=${{ github.sha }}
            DSA_WEB_REVISION=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prepare ssh
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DSA_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 124.223.8.213 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Push runtime secrets
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DNSPOD_API_ID: ${{ secrets.DNSPOD_API_ID }}
          DNSPOD_API_TOKEN: ${{ secrets.DNSPOD_API_TOKEN }}
        run: |
          set -euo pipefail
          for name in DEEPSEEK_API_KEY TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID DNSPOD_API_ID DNSPOD_API_TOKEN; do
            value="${!name:-}"
            if [ -z "$value" ]; then echo "$name: not set, skipped"; continue; fi
            printf '%s' "$value" | ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
              ubuntu@124.223.8.213 "setenv $name"
          done

      - name: Deploy
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=40 \
            ubuntu@124.223.8.213 "deploy $SHA"

      - name: Verify site
        run: |
          curl -fsS -o /dev/null -w 'site=%{http_code}\n' http://stock.qianxue.online/ \
            || echo "verify skipped: site not reachable yet"
