name: deploy-swr

# Build the image on a GitHub runner, push it to Huawei Cloud SWR, then trigger
# the restricted deploy entry on the server. The server never builds.
#
# Required repository secrets:
#   SWR_USERNAME / SWR_PASSWORD     registry credentials for SWR
#   DSA_DEPLOY_SSH_KEY              private key whose public half is locked to
#                                   command="/usr/local/bin/agent-ops-gh-deploy-dsa",restrict
#   DEPLOY_HOST / DEPLOY_USER       e.g. 124.223.8.213 / ubuntu
#   DEPLOY_PORT                     optional, defaults to 22
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dsa-deploy
  cancel-in-progress: false

env:
  REGISTRY: swr.cn-north-4.myhuaweicloud.com
  IMAGE: swr.cn-north-4.myhuaweicloud.com/agent-playground/dsa

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            DSA_WEB_VERSION=${{ github.sha }}
            DSA_WEB_REVISION=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH deploy
        env:
          # Target host is not a secret: it is the same public IP that serves the domain.
          HOST: 124.223.8.213
          PORT: 22
          USER: ubuntu
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DSA_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$PORT" "$USER@$HOST" "deploy $SHA"

      - name: Verify site
        # Tolerated until DNS and the Caddy site block are in place.
        run: |
          curl -fsS -o /dev/null -w 'site https=%{http_code}\n' https://stock.qianxue.online/ \
            || echo "verify skipped: domain not wired up yet"
